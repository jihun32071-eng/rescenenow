name: Update RESCENE NOW

on:
  push:
    branches: [main]
    paths-ignore:
      - site/snapshot.json
      - site/schedule-snapshot.json
      - backend/archive.json
  workflow_dispatch:
  schedule:
    # UTC, away from the busy start of each hour. GitHub may delay scheduled jobs.
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: rescene-now-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Refresh videos, news and schedules
        run: node refresh.mjs
      - name: Save changed snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/snapshot.json site/schedule-snapshot.json backend/archive.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public feeds and schedule snapshots'
            git push origin HEAD:main
          fi
      - name: Upload website
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove the deployed temporary artifact
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.update.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
